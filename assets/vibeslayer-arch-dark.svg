    <text class="mono mono-lo" x="374" y="191">vs-server (feature = "web")</text>

    <line x1="613" y1="150" x2="753" y2="150" stroke="#38BDF8" stroke-width="1.35" marker-start="url(#arr-enc-rev)" marker-end="url(#arr-enc)"/>
    <rect x="631" y="135" width="104" height="30" rx="3" fill="#05070B" stroke="#1E3A52" stroke-width="0.9"/>
