    <text class="mono wire-sub-lbl" x="683" y="159">pubkey-bound HKDF</text>

    <rect x="756" y="98" width="248" height="104" rx="4" fill="#0C111B" stroke="#1E293B" stroke-width="1"/>
    <circle cx="771" cy="114" r="3" fill="#10B981"/>
