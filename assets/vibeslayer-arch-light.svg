<svg xmlns="http://www.w3.org/2000/svg" width="980" height="596" viewBox="0 0 980 596" role="img" aria-label="Vibe-Slayer Multi-Domain Protection Architecture">
  <defs>
    <marker id="arr-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#8A9BB0" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-acc-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#0284C7" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-out-light" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 1.5 2 L 7.5 5 L 1.5 8" fill="none" stroke="#059669" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="clip-out-1-light"><rect x="38" y="476" width="268" height="80" rx="8"/></clipPath>
    <clipPath id="clip-out-2a-light"><rect x="356" y="476" width="129" height="80" rx="8"/></clipPath>
    <clipPath id="clip-out-2b-light"><rect x="495" y="476" width="129" height="80" rx="8"/></clipPath>
    <clipPath id="clip-out-3a-light"><rect x="674" y="476" width="129" height="80" rx="8"/></clipPath>
    <clipPath id="clip-out-3b-light"><rect x="813" y="476" width="129" height="80" rx="8"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .hub-title { font-size: 15px; font-weight: 700; fill: #0F172A; letter-spacing: -0.2px; }
      .col-hdr   { font-size: 10.8px; font-weight: 700; fill: #132035; letter-spacing: 0.65px; }
      .step-num  { font-size: 10px; font-weight: 700; fill: #0369A1; text-anchor: middle; }
      .card-cmd  { font-size: 12px; font-weight: 700; fill: #0369A1; }
      .card-ttl  { font-size: 12.2px; font-weight: 700; fill: #0F172A; }
      .split-cmd { font-size: 11.4px; font-weight: 700; fill: #0369A1; }
      .split-ttl { font-size: 11.6px; font-weight: 700; fill: #0F172A; }
      .out-ttl   { font-size: 12.2px; font-weight: 700; fill: #065F46; }
      .out-sm    { font-size: 11.2px; font-weight: 700; fill: #065F46; }
      .out2-sm   { font-size: 11.2px; font-weight: 700; fill: #075985; }
      .body      { font-size: 11px; font-weight: 400; fill: #334155; }
      .body-sm   { font-size: 10.6px; font-weight: 400; fill: #334155; }
      .muted     { font-size: 10.5px; font-weight: 400; fill: #52657D; }
      .muted-sm  { font-size: 10.2px; font-weight: 400; fill: #52657D; }
      .tag       { font-size: 9.2px; font-weight: 700; fill: #3F4F63; letter-spacing: 0.5px; text-anchor: end; }
      .chip-txt  { font-size: 10.8px; font-weight: 500; fill: #1E293B; text-anchor: middle; }
      .badge-txt { font-size: 9.5px; font-weight: 700; fill: #0369A1; letter-spacing: 0.55px; text-anchor: middle; }
      .rec-txt   { font-size: 9px; font-weight: 700; fill: #0369A1; letter-spacing: 0.4px; text-anchor: middle; }
      .pill-txt  { font-size: 9px; font-weight: 700; fill: #3F4F63; letter-spacing: 0.4px; text-anchor: middle; }
      .edge      { fill: none; stroke: #8A9BB0; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
      .edge-acc  { fill: none; stroke: #0284C7; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .edge-out  { fill: none; stroke: #059669; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Self-contained rounded surface canvas (theme-mismatch safe, crisp edges) -->
  <rect x="1" y="1" width="978" height="594" rx="14" fill="#FFFFFF" stroke="#D8E0EA" stroke-width="1"/>

  <!-- TOP ORCHESTRATOR HUB -->
  <g id="orchestrator-hub">
    <rect x="66" y="20" width="848" height="94" rx="10" fill="#F8FBFF" stroke="#0284C7" stroke-width="1.25"/>
    <line x1="150" y1="20.6" x2="830" y2="20.6" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

    <!-- Top Row: unified rx=5 badges on both ends -->
    <rect x="86" y="34" width="92" height="21" rx="5" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.9"/>
    <text class="mono badge-txt" x="132" y="48">CORE BINARY</text>

    <text class="sans hub-title" x="192" y="49.5">vibe-slayer — Standalone Rust + C99 Engine</text>

    <rect x="708" y="34" width="186" height="21" rx="5" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.9"/>
    <text class="mono badge-txt" x="801" y="48">0 CRATES · ZERO NODE.JS</text>

    <!-- Bottom Row: 3 Equal Capability Chips (w=260, gap=14, optically centered at y=87) -->
    <rect x="86" y="69" width="260" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans chip-txt" x="216" y="86.5">Natural-Language CLI (ask / explain)</text>

    <rect x="360" y="69" width="260" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans chip-txt" x="490" y="86.5">Explicit CLI (website · shield-3d · scan)</text>

    <rect x="634" y="69" width="260" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text class="sans chip-txt" x="764" y="86.5">Presets (fast · balanced · paranoid)</text>
  </g>

  <!-- ORTHOGONAL DISTRIBUTION BUS (clean curved shoulders, zero trident dot) -->
  <g id="bus-connectors">
    <circle cx="490" cy="114" r="3" fill="#0284C7"/>
    <path class="edge-acc" d="M 490,117 L 490,164" marker-end="url(#arr-acc-light)"/>
    <path class="edge-acc" d="M 490,130 Q 490,140 480,140 L 182,140 Q 172,140 172,150 L 172,164" marker-end="url(#arr-acc-light)"/>
    <path class="edge-acc" d="M 490,130 Q 490,140 500,140 L 798,140 Q 808,140 808,150 L 808,164" marker-end="url(#arr-acc-light)"/>
  </g>

  <!-- COLUMN 1: LIVE WEBSITES & WEB COMPONENTS -->
  <g id="col-web">
    <rect x="22" y="170" width="300" height="404" rx="11" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1.15"/>

    <rect x="38" y="186" width="26" height="20" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="0.9"/>
    <text class="mono step-num" x="51" y="199.5">01</text>
    <text class="sans col-hdr" x="74" y="200">WEBSITES &amp; WEB COMPONENTS</text>
    <line x1="38" y1="218" x2="306" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Stage 1: Build -->
    <rect x="38" y="234" width="268" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono card-cmd" x="52" y="257">website --preset paranoid</text>
    <text class="mono tag" x="292" y="256">BUILD</text>
    <text class="sans body" x="52" y="277">.vsweb AES-256-GCM + rtKey JS</text>
    <text class="sans muted" x="52" y="294">Boot anti-CDP &amp; inline stealth guard</text>

    <line class="edge" x1="172" y1="308" x2="172" y2="340" marker-end="url(#arr-light)"/>

    <!-- Stage 2: Runtime Server (server-enforced controls only) -->
    <rect x="38" y="346" width="268" height="94" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.15"/>
    <text class="sans card-ttl" x="52" y="369"><tspan class="mono card-cmd">serve</tspan> · RFC 9112 HTTP/1.1</text>
    <text class="mono tag" x="292" y="368">SERVER</text>
    <text class="sans body" x="52" y="390">Ephemeral ECDH P-256 key leases</text>
    <text class="sans body" x="52" y="407">Single-use IP HMAC tickets &amp; Origin</text>
    <text class="sans muted" x="52" y="424">Header &amp; stealth-score verification</text>

    <line class="edge-out" x1="172" y1="440" x2="172" y2="470" marker-end="url(#arr-out-light)"/>

    <!-- Stage 3: Verified Browser Boundary -->
    <rect x="38" y="476" width="268" height="80" rx="8" fill="#F2FBF7" stroke="#7FC5A8" stroke-width="1.15"/>
    <g clip-path="url(#clip-out-1-light)">
      <rect x="38" y="476" width="4" height="80" fill="#059669"/>
    </g>
    <text class="sans out-ttl" x="54" y="499">Verified Browser WebCrypto</text>
    <text class="sans body" x="54" y="519">extractable: false · 0 offline bits</text>
    <text class="sans muted" x="54" y="537">Shadow DOM &amp; Custom Elements</text>
  </g>

  <!-- COLUMN 2: INTERACTIVE 3D (.GLB) -->
  <g id="col-3d">
    <rect x="340" y="170" width="300" height="404" rx="11" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1.15"/>

    <rect x="356" y="186" width="26" height="20" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="0.9"/>
    <text class="mono step-num" x="369" y="199.5">02</text>
    <text class="sans col-hdr" x="392" y="200">INTERACTIVE 3D (.GLB)</text>
    <line x1="356" y1="218" x2="624" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Stage 1: Cook / Shield -->
    <rect x="356" y="234" width="268" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono card-cmd" x="370" y="257">shield-3d --preset paranoid</text>
    <text class="mono tag" x="610" y="256">COOK</text>
    <text class="sans body" x="370" y="277">scene.vsshield2 + tile atlases</text>
    <text class="sans muted" x="370" y="294">External .vsshield.key · no raw .glb</text>

    <!-- Fork: secondary gray branch drawn FIRST, primary blue branch ON TOP (zero overpaint!) -->
    <path class="edge" d="M 490,308 L 490,317 Q 490,325 498,325 L 551.5,325 Q 559.5,325 559.5,333 L 559.5,340" marker-end="url(#arr-light)"/>
    <path class="edge-acc" d="M 490,308 L 490,317 Q 490,325 482,325 L 428.5,325 Q 420.5,325 420.5,333 L 420.5,340" marker-end="url(#arr-acc-light)"/>

    <!-- Stage 2A: serve-3d stream mode -->
    <rect x="356" y="346" width="129" height="94" rx="8" fill="#F0F9FF" stroke="#38BDF8" stroke-width="1.15"/>
    <text class="mono split-cmd" x="368" y="367">serve-3d</text>
    <rect x="368" y="375" width="94" height="17" rx="4" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="0.75"/>
    <text class="mono rec-txt" x="415" y="386.5">--mode stream</text>
    <text class="sans body-sm" x="368" y="410">0 verts · 0 WebGL</text>
    <text class="sans muted-sm" x="368" y="426">Paranoid default</text>

    <!-- Stage 2B: serve-3d gpu mode -->
    <rect x="495" y="346" width="129" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono split-cmd" x="507" y="367">serve-3d</text>
    <rect x="507" y="375" width="76" height="17" rx="4" fill="#F1F5F9" stroke="#D3DCE6" stroke-width="0.75"/>
    <text class="mono pill-txt" x="545" y="386.5">--mode gpu</text>
    <text class="sans body-sm" x="507" y="410">60 FPS WebGL2</text>
    <text class="sans muted-sm" x="507" y="426">Shader cipher</text>

    <!-- Independent outcome arrows for stream vs gpu -->
    <line class="edge-out" x1="420.5" y1="440" x2="420.5" y2="470" marker-end="url(#arr-out-light)"/>
    <line class="edge-acc" x1="559.5" y1="440" x2="559.5" y2="470" marker-end="url(#arr-acc-light)"/>

    <!-- Stage 3A: Zero-Geometry Stream Outcome -->
    <rect x="356" y="476" width="129" height="80" rx="8" fill="#F2FBF7" stroke="#7FC5A8" stroke-width="1.15"/>
    <g clip-path="url(#clip-out-2a-light)">
      <rect x="356" y="476" width="3.5" height="80" fill="#059669"/>
    </g>
    <text class="sans out-sm" x="368" y="499">Canvas2D Stream</text>
    <text class="sans body-sm" x="368" y="519">AES-GCM frames</text>
    <text class="sans muted-sm" x="368" y="537">64-bit pixel WM</text>

    <!-- Stage 3B: Hardened WebGL2 Outcome -->
    <rect x="495" y="476" width="129" height="80" rx="8" fill="#F4F9FE" stroke="#93C5FD" stroke-width="1.15"/>
    <g clip-path="url(#clip-out-2b-light)">
      <rect x="495" y="476" width="3.5" height="80" fill="#0284C7"/>
    </g>
    <text class="sans out2-sm" x="507" y="499">Hardened WebGL2</text>
    <text class="sans body-sm" x="507" y="519">Chaff + tile atlas</text>
    <text class="sans muted-sm" x="507" y="537">64-bit mesh WM</text>
  </g>

  <!-- COLUMN 3: REPOS, ELF64 & AI WEIGHTS -->
  <g id="col-vault">
    <rect x="658" y="170" width="300" height="404" rx="11" fill="#F8FAFC" stroke="#D5DEE9" stroke-width="1.15"/>

    <rect x="674" y="186" width="26" height="20" rx="5" fill="#E0F2FE" stroke="#93C5FD" stroke-width="0.9"/>
    <text class="mono step-num" x="687" y="199.5">03</text>
    <text class="sans col-hdr" x="710" y="200">REPOS, ELF64 &amp; AI WEIGHTS</text>
    <line x1="674" y1="218" x2="942" y2="218" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Stage 1: Auto-Classification & Seal -->
    <rect x="674" y="234" width="268" height="74" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="mono card-cmd" x="688" y="257">scan · protect · unseal</text>
    <text class="mono tag" x="928" y="256">SEAL</text>
    <text class="sans body" x="688" y="277">Auto-routes code, .env, .wasm &amp; AI</text>
    <text class="sans muted" x="688" y="294">0600 key vault + .gitignore hygiene</text>

    <!-- Fork -->
    <path class="edge" d="M 808,308 L 808,317 Q 808,325 800,325 L 746.5,325 Q 738.5,325 738.5,333 L 738.5,340" marker-end="url(#arr-light)"/>
    <path class="edge" d="M 808,308 L 808,317 Q 808,325 816,325 L 869.5,325 Q 877.5,325 877.5,333 L 877.5,340" marker-end="url(#arr-light)"/>

    <!-- Stage 2A: VSPK3 Vault (accurate whole-file headerless CMT4 AEAD) -->
    <rect x="674" y="346" width="129" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="sans split-ttl" x="686" y="367">VSPK3 Vault</text>
    <rect x="686" y="375" width="84" height="17" rx="4" fill="#F1F5F9" stroke="#D3DCE6" stroke-width="0.75"/>
    <text class="mono pill-txt" x="728" y="386.5">HEADERLESS</text>
    <text class="sans body-sm" x="686" y="410">CMT4 + ChaCha20</text>
    <text class="sans muted-sm" x="686" y="426">1024 B pad AEAD</text>

    <!-- Stage 2B: Static-PIE ELF64 -->
    <rect x="813" y="346" width="129" height="94" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.1"/>
    <text class="sans split-ttl" x="825" y="367">Static-PIE ELF64</text>
    <rect x="825" y="375" width="76" height="17" rx="4" fill="#F1F5F9" stroke="#D3DCE6" stroke-width="0.75"/>
    <text class="mono pill-txt" x="863" y="386.5">NO INTERP</text>
    <text class="sans body-sm" x="825" y="410">0 DT_NEEDED</text>
    <text class="sans muted-sm" x="825" y="426">CET · memfd exec</text>

    <!-- Independent outcome arrows for VSPK3 SDKs vs Direct Linux Exec -->
    <line class="edge-out" x1="738.5" y1="440" x2="738.5" y2="470" marker-end="url(#arr-out-light)"/>
    <line class="edge-out" x1="877.5" y1="440" x2="877.5" y2="470" marker-end="url(#arr-out-light)"/>

    <!-- Stage 3A: Polyglot SDKs -->
    <rect x="674" y="476" width="129" height="80" rx="8" fill="#F2FBF7" stroke="#7FC5A8" stroke-width="1.15"/>
    <g clip-path="url(#clip-out-3a-light)">
      <rect x="674" y="476" width="3.5" height="80" fill="#059669"/>
    </g>
    <text class="sans out-sm" x="686" y="499">Polyglot SDKs</text>
    <text class="sans body-sm" x="686" y="519">Rust · C · Go · Py</text>
    <text class="sans muted-sm" x="686" y="537">+ JS VSRA 64 KiB</text>

    <!-- Stage 3B: Direct Linux Exec -->
    <rect x="813" y="476" width="129" height="80" rx="8" fill="#F2FBF7" stroke="#7FC5A8" stroke-width="1.15"/>
    <g clip-path="url(#clip-out-3b-light)">
      <rect x="813" y="476" width="3.5" height="80" fill="#059669"/>
    </g>
    <text class="sans out-sm" x="825" y="499">Linux Execution</text>
    <text class="sans body-sm" x="825" y="519">FD-3 lease runner</text>
    <text class="sans muted-sm" x="825" y="537">or --standalone</text>
  </g>
</svg>
