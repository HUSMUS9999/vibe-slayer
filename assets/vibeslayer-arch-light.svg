  <line class="ea" x1="370" y1="264" x2="370" y2="278" marker-end="url(#arr-acc)"/>
  <line class="e" x1="490" y1="264" x2="490" y2="278" marker-end="url(#arr)"/>

  <rect class="ok" x="314" y="282" width="232" height="62" rx="7"/>
  <text class="ok-t" x="430" y="304">Zero-Geometry Canvas2D / WebGL2</text>
