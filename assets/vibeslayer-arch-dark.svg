    <text class="mono zone-sub" x="620" y="76">SERVER · VAULT</text>
    <rect x="350" y="86" width="272" height="488" rx="6" fill="#080F18" stroke="#192D42" stroke-width="1"/>

    <line x1="683" y1="86" x2="683" y2="574" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.62"/>
    <rect x="631" y="64" width="104" height="17" rx="3" fill="#071828" stroke="#1E4968" stroke-width="0.9"/>
    <text class="mono tb-stamp" x="683" y="75.3">TRUST BOUNDARY</text>

    <text class="mono zone-lbl" x="746" y="76">UNTRUSTED EXECUTION</text>
    <text class="mono zone-sub" x="1014" y="76">CLIENT · HOST</text>
    <rect x="744" y="86" width="272" height="488" rx="6" fill="#06090E" stroke="#1A2434" stroke-width="1" stroke-dasharray="4 3"/>
  </g>

  <!-- ==================== BAND 1: AUTHENTICATED .VSWEB V2 BUNDLES ==================== -->
  <g id="band-web">
