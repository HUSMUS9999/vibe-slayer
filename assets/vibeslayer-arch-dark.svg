    <text x="48" y="118"><tspan class="mono node-cmd">website</tspan><tspan class="sans node-ttl"> · .vsweb v2 Builder</tspan></text>
    <text class="sans line-hi" x="48" y="137">Per-asset HKDF AES-256-GCM</text>
    <text class="sans line-md" x="48" y="154">HMAC-SHA256 manifest + typed AAD</text>
    <text class="mono mono-dim" x="48" y="171">VSWEBV02 · 0600 key generation</text>
    <text class="mono mono-lo" x="48" y="191">crates/vs-server/src/web.rs</text>

    <circle cx="276" cy="150" r="2.1" fill="#64748B"/>
