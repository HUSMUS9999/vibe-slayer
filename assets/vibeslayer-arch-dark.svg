    <text class="mono mono-hi" x="768" y="137">CryptoKey { extractable: false }</text>
    <text class="sans line-md" x="768" y="154">0 global window key manifests</text>
    <text class="sans line-md" x="768" y="171">Per-token cache + transient retry</text>
    <text class="mono mono-lo" x="768" y="191">/__vibeslayer/loader.js</text>
  </g>

