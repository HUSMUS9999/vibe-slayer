    <text class="mono hdr-sub" x="166" y="30.2"><tspan fill="#334155">/</tspan>  MODULAR ARCHITECTURE &amp; TRUST BOUNDARIES</text>
    <text class="mono hdr-pkgs" x="1016" y="30.2">crates/vs-* · forbid(unsafe_code) · ring (BoringSSL)</text>
    <line x1="1" y1="50" x2="1039" y2="50" stroke="#151E2C" stroke-width="1"/>
  </g>

