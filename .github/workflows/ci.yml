name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build native Rust CLI and C99 SDK
        run: make -C vibeslayer-native-core all

      - name: Run Rust release unit tests
        run: cargo test --manifest-path vibeslayer-native-core/rust_core/Cargo.toml --release

      - name: Test vibeslayer-suite (Node.js)
        run: npm test --prefix vibeslayer-suite

      - name: Test vibeslayer-policy-kit (Node.js)
        run: npm test --prefix vibeslayer-policy-kit
