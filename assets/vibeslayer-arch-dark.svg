    </marker>
    <marker id="arr-enc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0.5 1 L 7.2 4 L 0.5 7 Z" fill="#38BDF8"/>
