[package]
name = "vs-server"
description = "Async Tokio/Axum hardened .vsweb v2 asset server and optional multi-SKU server-rendered 3D streaming module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["3d", "web"]
3d = ["dep:vs-3d", "dep:vs-watermark", "dep:image"]
web = []

[dependencies]
vs-crypto.workspace = true
vs-3d = { workspace = true, optional = true }
vs-watermark = { workspace = true, optional = true }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
hex.workspace = true
ipnet.workspace = true
zeroize.workspace = true
image = { workspace = true, optional = true }

[dev-dependencies]
ring.workspace = true
tokio = { version = "1", features = ["io-util"] }
