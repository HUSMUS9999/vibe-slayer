    <clipPath id="clip-srv-2"><rect x="362" y="214" width="248" height="136" rx="4"/></clipPath>
    <clipPath id="clip-srv-4"><rect x="362" y="494" width="248" height="68" rx="4"/></clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

      .hdr-brand { font-size: 12.5px; font-weight: 700; fill: #F1F5F9; letter-spacing: 0.9px; }
      .hdr-sub   { font-size: 9.8px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.7px; }
      .hdr-pkgs  { font-size: 9.1px; font-weight: 400; fill: #64748B; text-anchor: end; }

      .zone-lbl      { font-size: 9.4px; font-weight: 700; fill: #94A3B8; letter-spacing: 0.85px; }
      .zone-lbl-acc  { font-size: 9.4px; font-weight: 700; fill: #38BDF8; letter-spacing: 0.85px; }
      .zone-sub      { font-size: 8.5px; font-weight: 500; fill: #64748B; letter-spacing: 0.65px; text-anchor: end; }
      .tb-stamp      { font-size: 8.2px; font-weight: 700; fill: #7DD3FC; letter-spacing: 0.75px; text-anchor: middle; }
      .micro-hdr     { font-size: 8.2px; font-weight: 700; fill: #64748B; letter-spacing: 0.85px; }

      .node-cmd  { font-size: 11.2px; font-weight: 700; fill: #38BDF8; }
      .node-ttl  { font-size: 11.2px; font-weight: 600; fill: #F1F5F9; }
      .node-ttl-sm { font-size: 10.6px; font-weight: 600; fill: #F1F5F9; }
      .lane-cmd  { font-size: 10.2px; font-weight: 700; fill: #38BDF8; }
      .lane-cmd2 { font-size: 10.2px; font-weight: 700; fill: #CBD5E1; }
      .lane-ttl  { font-size: 10px; font-weight: 500; fill: #CBD5E1; }

      .line-hi   { font-size: 10px; font-weight: 400; fill: #CBD5E1; }
      .line-md   { font-size: 9.8px; font-weight: 400; fill: #94A3B8; }
      .line-lo   { font-size: 9px; font-weight: 400; fill: #7E92AD; }
      .mono-hi   { font-size: 9.1px; font-weight: 500; fill: #CBD5E1; }
      .mono-md   { font-size: 8.6px; font-weight: 400; fill: #94A3B8; }
      .mono-lo   { font-size: 8.3px; font-weight: 400; fill: #64748B; }
      .mono-dim  { font-size: 8.4px; font-weight: 400; fill: #7E92AD; }

      .wire-art-lbl { font-size: 8.4px; font-weight: 500; fill: #94A3B8; text-anchor: middle; }
      .wire-enc-lbl { font-size: 8.5px; font-weight: 600; fill: #7DD3FC; text-anchor: middle; }
      .wire-sub-lbl { font-size: 7.9px; font-weight: 400; fill: #94A3B8; text-anchor: middle; }
      .wire-iso-lbl { font-size: 8.5px; font-weight: 600; fill: #6EE7B7; text-anchor: middle; }

      .leg-txt { font-size: 8.6px; font-weight: 400; fill: #7E92AD; }
      .leg-end { font-size: 8.6px; font-weight: 400; fill: #7E92AD; text-anchor: end; }
